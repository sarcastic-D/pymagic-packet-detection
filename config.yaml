# --- Paths ---
INPUT_FILE: "conditions.json"
OUTPUT_DIR: "output_v2"
COMBINED_RULES_FILE: "combined_rules_v2.json"

# --- HMAC Security (Must match between agent_core.py and webhook_sender.py) ---
SHARED_SECRET: "SentinelForge_SuperSecretKey_2026"

# --- Agent Core Webhook URL ---
AGENT_URL: "http://127.0.0.1:5000/api/v1/alert"

# Research/Loop Files
PCAP_MALWARE_FILE: "synthetic_malware_v2.pcap"
PCAP_CLEAN_FILE: "clean_traffic.pcap"  
INFERRED_RULES_FILE: "inferred_conditions_v2.json"
# --- Whitelist ---
# WHITELIST_IPS: IPs that should NEVER trigger alerts.
# IMPORTANT: 192.168.1.1 (pfSense LAN) is whitelisted because pfSense sends its own
# background traffic (DHCP, ARP, health checks) that triggers false positives.
# This is SAFE only because Pure NAT mode is enabled in pfSense (System > Advanced >
# Firewall & NAT > NAT Reflection = Pure NAT). In Pure NAT mode, attack traffic from
# Kali shows its REAL source IP (e.g. 10.0.2.199), NOT 192.168.1.1.
# If you ever switch back to Masquerade NAT, remove 192.168.1.1 from this list!
WHITELIST_IPS: 
  - "127.0.0.1"
  - "192.168.1.100"  # Ubuntu itself
  - "192.168.1.104"  # Ubuntu secondary IP
  - "10.0.2.1"       # VirtualBox NAT Gateway
  - "192.168.1.1"    # pfSense LAN interface (safe to whitelist with Pure NAT enabled)

# --- Plugin Architecture ---
FIREWALL_TYPE: "pfsense"  # Options: "mock", "pfsense", "linux"

# pfSense SSH Driver Configuration
PFSENSE_HOST: "192.168.1.1"
PFSENSE_PORT: 22
PFSENSE_USER: "admin"
PFSENSE_PASSWORD: "pfsense"
PFSENSE_WAN_INTERFACE: "lan"

# --- LRU Rate Limiting ---
LRU_CACHE_TTL: 5            # Seconds before allowing a re-ban for the same IP
LRU_CACHE_MAX_SIZE: 1024     # Max unique IPs to track

# --- Shannon Entropy ---
ENTROPY_THRESHOLD: 6.5       # Payload entropy above this triggers anomaly detection (min ~90 bytes of random data)
ENTROPY_SCORE_BOOST: 35      # Points added to threat score for high entropy
ENTROPY_MIN_PAYLOAD_SIZE: 32 # Only calculate entropy on payloads >= this many bytes

# --- Quarantine & Benign Buffers ---
QUARANTINE_BUFFER: "quarantine_buffer.pcap"
BENIGN_BUFFER: "benign_buffer.pcap"

# --- Live Sniffing ---
SNIFF_INTERFACE: "enp0s3"
SNIFF_FILTER: "ip"

# --- Risk Scoring Model ---
# Academic Justification: 'Feature Specificity'
SCORING_WEIGHTS:
  payload_magic: 30        # Very Specific (Hex bytes)
  password: 30             # Very Specific (String)
  payload_starts_with: 25  # Specific Prefix
  tcp_option_value: 20     # Protocol Anomaly (Low Level)
  ip_offset: 20            # Payload Structure
  seq: 15                  # Header Anomaly
  ack: 15                  # Header Anomaly
  window_size: 15          # Header Anomaly
  sport: 10                # General L4
  dport: 5                 # Lowest (Common ports reused)
  entropy: 35              # Shannon Entropy (Encrypted Payload Detection)

# --- Detection Thresholds ---
MATCH_SCORE_THRESHOLD: 60  # Minimum score (0-100) to alert
INFERENCE_THRESHOLD: 0.1   # Frequency (10%) in traffic to infer a rule